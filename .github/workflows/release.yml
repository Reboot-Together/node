name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "배포할 버전 (예: 0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Read and validate version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.Trim().TrimStart('v', 'V')
          $parsed = $null
          if (-not [System.Version]::TryParse($version, [ref]$parsed) -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use MAJOR.MINOR.PATCH: $version"
          }
          "ASTERISM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASTERISM_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: |
          dotnet restore Asterism.csproj
          dotnet restore Checks/Asterism.Checks.csproj

      - name: Build application
        run: dotnet build Asterism.csproj -c Release --no-restore

      - name: Run checks
        run: dotnet run --project Checks/Asterism.Checks.csproj -c Release --no-restore

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\Asterism-$env:ASTERISM_VERSION-win-x64"
          dotnet publish Asterism.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$env:ASTERISM_VERSION `
            -p:AssemblyVersion="$env:ASTERISM_VERSION.0" `
            -p:FileVersion="$env:ASTERISM_VERSION.0" `
            -p:InformationalVersion=$env:ASTERISM_VERSION `
            -p:DebugType=None -p:DebugSymbols=false `
            --output $publishDir

          foreach ($required in @('App.xbf', 'MainWindow.xbf', 'Asterism.pri')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDir $required))) {
              throw "Required WinUI resource is missing from publish output: $required"
            }
          }

          $localePattern = '^[a-z]{2,3}(?:-[A-Za-z0-9]+)+$'
          Get-ChildItem -LiteralPath $publishDir -Directory |
            Where-Object { $_.Name -match $localePattern -and $_.Name -notin @('ko-KR', 'en-US') } |
            Remove-Item -Recurse -Force

          "ASTERISM_SOURCE_DIR=$publishDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASTERISM_OUTPUT_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'artifacts')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
          }
          & $compiler "installer\Asterism.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item "artifacts\Asterism-$env:ASTERISM_VERSION-Setup-win-x64.exe"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "artifacts\Asterism-$env:ASTERISM_VERSION-SHA256.txt" -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:ASTERISM_TAG" `
            "artifacts\Asterism-$env:ASTERISM_VERSION-Setup-win-x64.exe" `
            "artifacts\Asterism-$env:ASTERISM_VERSION-SHA256.txt" `
            --target "${{ github.sha }}" `
            --title "Asterism $env:ASTERISM_TAG" `
            --generate-notes
