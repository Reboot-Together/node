name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore Asterism.csproj
          dotnet restore Checks/Asterism.Checks.csproj

      - name: Build application
        run: dotnet build Asterism.csproj -c Release --no-restore

      - name: Run checks
        run: dotnet run --project Checks/Asterism.Checks.csproj -c Release --no-restore
